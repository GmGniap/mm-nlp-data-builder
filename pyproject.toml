[project]
name = "mm-nlp-data-builder"
version = "0.1.0"
description = "Building required tools for Myanmar NLP tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=2.3.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.2",
    "flask-wtf>=1.1.1",
    "wtforms>=3.0.1",
    "python-dotenv>=1.0.0",
    "werkzeug>=2.3.7",
    "email-validator",
    "psycopg2-binary>=2.9.7",
    "telethon>=1.34.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.37",
    "pyarrow>=14.0.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "services*"]
